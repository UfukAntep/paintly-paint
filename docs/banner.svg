<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <style>
    .logo { animation: bob 3s ease-in-out infinite; transform-origin: 210px 180px; }
    .stroke { stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw 3.2s ease-out .4s infinite; }
    .drop { animation: float 4s ease-in-out infinite; }
    .d2 { animation-delay: .6s; } .d3 { animation-delay: 1.2s; } .d4 { animation-delay: 1.8s; } .d5 { animation-delay: 2.4s; }
    .spark { animation: twinkle 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .s2 { animation-delay: .8s; } .s3 { animation-delay: 1.6s; }
    @keyframes bob { 0%,100% { transform: rotate(-4deg) translateY(0); } 50% { transform: rotate(4deg) translateY(-10px); } }
    @keyframes draw { 0% { stroke-dashoffset: 900; } 55%,85% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -900; } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-16px); } }
    @keyframes twinkle { 0%,100% { transform: scale(.4); opacity: .3; } 50% { transform: scale(1.1); opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/><stop offset=".55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="br" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fda4af"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
  </defs>
  <rect width="1200" height="360" rx="36" fill="url(#bg)"/>
  <circle cx="1080" cy="40" r="120" fill="#fff" opacity=".08"/>
  <circle cx="120" cy="340" r="90" fill="#fff" opacity=".07"/>

  <!-- paint drops -->
  <g class="drop"><circle cx="1010" cy="90" r="14" fill="#facc15"/></g>
  <g class="drop d2"><circle cx="1085" cy="150" r="11" fill="#34d399"/></g>
  <g class="drop d3"><circle cx="1130" cy="240" r="15" fill="#60a5fa"/></g>
  <g class="drop d4"><circle cx="980" cy="280" r="10" fill="#fde68a"/></g>
  <g class="drop d5"><circle cx="1050" cy="310" r="8" fill="#fff"/></g>

  <!-- sparkles -->
  <path class="spark" d="M370 70l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" fill="#fff"/>
  <path class="spark s2" d="M930 200l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#fff"/>
  <path class="spark s3" d="M600 300l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#fde68a"/>

  <!-- logo -->
  <g class="logo">
    <rect x="110" y="80" width="200" height="200" rx="54" fill="#fff" opacity=".18"/>
    <g transform="translate(110 80) scale(1.5625) translate(-8 -8)">
      <path d="M64 26c-21 0-38 15-38 34 0 18 15 30 31 30 5 0 6-3 6-6 0-2-1-3-2-5-1-1-2-3-2-5 0-3 3-6 6-6h8c13 0 26-7 26-22 0-11-15-20-35-20Z" fill="#fff"/>
      <circle cx="46" cy="58" r="6" fill="#f472b6"/><circle cx="56" cy="42" r="6" fill="#facc15"/><circle cx="74" cy="40" r="6" fill="#34d399"/><circle cx="87" cy="52" r="6" fill="#60a5fa"/>
      <path d="M98 76c-6 6-14 18-16 24l5 4c6-3 17-12 22-18 3-4 1-9-3-11-3-1-6-1-8 1Z" fill="url(#br)" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
      <path d="M80 101c-5 0-8 3-9 7-1 3-3 5-6 6 8 2 18 0 19-8Z" fill="#fff"/>
    </g>
  </g>

  <text x="360" y="178" font-family="Nunito, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="76" font-weight="900" fill="#fff" letter-spacing="-1">Paintly Paint</text>
  <text x="364" y="222" font-family="Nunito, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#fff" opacity=".92">Free, cute &amp; powerful image editor for Windows and macOS</text>
  <path class="stroke" d="M364 262c60-26 120 26 180 0s120-26 180 0 120 26 180 0" fill="none" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
</svg>
